services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: subscription-api
    depends_on:
      - db
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    networks:
      - backend
    

  db:
    image: postgres:16
    container_name: subscription-db
    env_file:
      - .env.docker
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend: